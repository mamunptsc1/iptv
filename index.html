<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live TV</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
margin:0;
background:#111;
color:#fff;
font-family:Arial,sans-serif;
}

.player{
width:100%;
aspect-ratio:16/9;
background:#000;
}

video{
width:100%;
height:100%;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
gap:10px;
padding:10px;
}

.card{
background:#222;
padding:10px;
border-radius:10px;
cursor:pointer;
text-align:center;
}

.card img{
width:60px;
height:60px;
object-fit:contain;
background:#fff;
border-radius:10px;
}

.search{
width:calc(100% - 20px);
margin:10px;
padding:10px;
font-size:16px;
}
</style>

</head>
<body>

<div class="player">
<video id="video" controls autoplay playsinline></video>
</div>

<input
type="text"
id="search"
class="search"
placeholder="Search Channel">

<div id="channels" class="grid"></div>

<script>

let allChannels=[];

fetch("bangla.json")
.then(r=>r.json())
.then(data=>{

if(data.channels){

allChannels=data.channels;

}else if(data.categories){

allChannels=
Object.values(data.categories).flat();

}

loadChannels(allChannels);

});

function loadChannels(channels){

document.getElementById("channels").innerHTML=
channels.map(ch=>`

<div class="card"
onclick="playChannel('${ch.url}')">

<img src="${ch.logo||'https://i.ibb.co/3k5p1t4/live-icon.png'}">

<h4>${ch.name}</h4>

</div>

`).join("");

}

function playChannel(url){

const video=
document.getElementById("video");

if(Hls.isSupported()){

if(window.hls){

window.hls.destroy();

}

window.hls=
new Hls();

window.hls.loadSource(url);

window.hls.attachMedia(video);

}else{

video.src=url;

}

video.play();

}

document
.getElementById("search")
.addEventListener("keyup",function(){

const value=
this.value.toLowerCase();

loadChannels(

allChannels.filter(ch=>

(ch.name||"")
.toLowerCase()
.includes(value)

)

);

});

</script>

</body>
</html>
